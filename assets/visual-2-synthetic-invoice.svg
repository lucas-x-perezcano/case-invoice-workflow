<text x="1058" y="646" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="end">260 MXN</text>
<text x="55" y="763" fill="#536A79" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Invented details; row 2 contains an intentional inconsistency. No real invoice or supplier information is shown.</text>
