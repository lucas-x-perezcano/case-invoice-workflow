<text x="968" y="392" fill="#536A79" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">LINE AMOUNT</text>
<rect x="80" y="407" width="1040" height="87" rx="8" fill="#F7F9FA" stroke="none" stroke-width="1"/>
