<text x="245" y="461" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">Demo Product A</text>
<text x="675" y="461" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="middle">2</text>
<text x="811" y="461" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="middle">50</text>
<text x="1058" y="461" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="end">100</text>
<text x="92" y="553" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="start">000456</text>
<text x="245" y="553" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">Demo Product B</text>
<text x="675" y="553" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="middle">3</text>
