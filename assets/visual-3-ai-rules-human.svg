<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="AI, deterministic rules, and human judgment">
<title>AI, deterministic rules, and human judgment</title>
<rect width="1200" height="800" fill="#F7F9FA"/>
<rect x="0" y="0" width="1200" height="12" rx="0" fill="#087E7B" stroke="none" stroke-width="1"/>
<text x="56" y="69" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start">Three kinds of work</text>
<text x="56" y="110" fill="#536A79" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Assign each decision to the method that fits it</text>
<rect x="1088" y="38" width="58" height="58" rx="16" fill="#E8F5F2" stroke="none" stroke-width="1"/>
<text x="1117" y="75" fill="#087E7B" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">03</text>
<rect x="55" y="165" width="340" height="510" rx="18" fill="#FFFFFF" stroke="#D9E3E8" stroke-width="1"/>
<rect x="55" y="165" width="340" height="10" rx="5" fill="#315F78" stroke="none" stroke-width="1"/>
<text x="80" y="215" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">AI interprets</text>
<text x="80" y="254" fill="#536A79" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Varied invoice layouts</text>
<text x="80" y="281" fill="#536A79" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">and wording</text>
<line x1="80" y1="307" x2="370" y2="307" stroke="#D9E3E8" stroke-width="2" stroke-linecap="round"/>
<rect x="79" y="317" width="292" height="77" rx="10" fill="#ECF3F7" stroke="none" stroke-width="1"/>
<text x="97" y="347" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Varied layout</text>
<text x="97" y="373" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">and wording</text>
<rect x="79" y="407" width="292" height="77" rx="10" fill="#ECF3F7" stroke="none" stroke-width="1"/>
<text x="97" y="437" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Proposed structured</text>
<text x="97" y="463" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">fields</text>
<rect x="430" y="165" width="340" height="510" rx="18" fill="#FFFFFF" stroke="#D9E3E8" stroke-width="1"/>
<rect x="430" y="165" width="340" height="10" rx="5" fill="#087E7B" stroke="none" stroke-width="1"/>
<text x="455" y="215" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">Rules check and route</text>
<text x="455" y="254" fill="#536A79" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Explicit checks stay</text>
<text x="455" y="281" fill="#536A79" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">predictable</text>
<line x1="455" y1="307" x2="745" y2="307" stroke="#D9E3E8" stroke-width="2" stroke-linecap="round"/>
<rect x="454" y="317" width="292" height="52" rx="10" fill="#E8F5F2" stroke="none" stroke-width="1"/>
<text x="472" y="347" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Product-code lookup</text>
<rect x="454" y="382" width="292" height="52" rx="10" fill="#E8F5F2" stroke="none" stroke-width="1"/>
<text x="472" y="412" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Line arithmetic warning</text>
<rect x="454" y="447" width="292" height="52" rx="10" fill="#E8F5F2" stroke="none" stroke-width="1"/>
<text x="472" y="477" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Spreadsheet creation</text>
<rect x="454" y="512" width="292" height="52" rx="10" fill="#E8F5F2" stroke="none" stroke-width="1"/>
<text x="472" y="542" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Response routing</text>
<rect x="805" y="165" width="340" height="510" rx="18" fill="#FFFFFF" stroke="#D9E3E8" stroke-width="1"/>
<rect x="805" y="165" width="340" height="10" rx="5" fill="#98631E" stroke="none" stroke-width="1"/>
<text x="830" y="215" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">People resolve exceptions</text>
<text x="830" y="254" fill="#536A79" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Judgment remains with</text>
<text x="830" y="281" fill="#536A79" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">a person</text>
<line x1="830" y1="307" x2="1120" y2="307" stroke="#D9E3E8" stroke-width="2" stroke-linecap="round"/>
<rect x="829" y="317" width="292" height="102" rx="10" fill="#FFF5E8" stroke="none" stroke-width="1"/>
<text x="847" y="347" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Intended warning reviewer:</text>
<text x="847" y="373" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">person responsible for</text>
<text x="847" y="399" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">invoice workflow</text>
<rect x="829" y="432" width="292" height="52" rx="10" fill="#FFF5E8" stroke="none" stroke-width="1"/>
<text x="847" y="462" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Missing catalog values</text>
<rect x="829" y="497" width="292" height="52" rx="10" fill="#FFF5E8" stroke="none" stroke-width="1"/>
<text x="847" y="527" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Questionable quantities</text>
<rect x="829" y="562" width="292" height="77" rx="10" fill="#FFF5E8" stroke="none" stroke-width="1"/>
<text x="847" y="592" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Persistent failures or</text>
<text x="847" y="618" fill="#193344" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">unexpected formats</text>
<line x1="401" y1="448" x2="417" y2="448" stroke="#087E7B" stroke-width="3" stroke-linecap="round"/>
<path d="M 411 442 L 419 448 L 411 454" fill="none" stroke="#087E7B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="776" y1="448" x2="792" y2="448" stroke="#087E7B" stroke-width="3" stroke-linecap="round"/>
<path d="M 786 442 L 794 448 L 786 454" fill="none" stroke="#087E7B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="55" y="705" width="1090" height="60" rx="12" fill="#FFF0ED" stroke="none" stroke-width="1"/>
<text x="76" y="744" fill="#A34C43" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Formal approval ownership is pending; warning-marked output is sent without a signoff gate.</text>
</svg>
